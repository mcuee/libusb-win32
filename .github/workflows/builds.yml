name: CI - Build libusb-win32 via Lightweight WDK NuGet

on: [push, pull_request]

jobs:
  build-via-wdk-nuget:
    name: Build via NuGet WDK Components
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Download and unpack the real WDK headers/libraries natively into the workspace
      - name: Fetch and Unpack WDK Development Components
        shell: powershell
        run: |
          Write-Host "Downloading matching 26100 WDK package via NuGet..."
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.2454 -OutputDirectory "${{ github.workspace }}\wdk_extracted"
          
          # Resolve the dynamic versioned folder name generated by NuGet
          $PackPath = Get-ChildItem -Path "${{ github.workspace }}\wdk_extracted\Microsoft.Windows.WDK.x64.*" | Select-Object -First 1
          
          # Setup the exact EWDK layout tree forced by make.cfg
          $EWDKFakeRoot = "${{ github.workspace }}\wdk_root"
          $TargetKitsPath = "$EWDKFakeRoot\Program Files\Windows Kits\10"
          
          New-Item -ItemType Directory -Force -Path "$TargetKitsPath\Include"
          New-Item -ItemType Directory -Force -Path "$TargetKitsPath\Lib"
          New-Item -ItemType Directory -Force -Path "$TargetKitsPath\Tools\10.0.26100.0\x64"
          
          Write-Host "Mapping verified kernel headers and build tools into simulated EWDK root..."
          if (Test-Path "$($PackPath.FullName)\Include") {
              Copy-Item -Path "$($PackPath.FullName)\Include\*" -Destination "$TargetKitsPath\Include" -Recurse -Force
          } elseif (Test-Path "$($PackPath.FullName)\include") {
              Copy-Item -Path "$($PackPath.FullName)\include\*" -Destination "$TargetKitsPath\Include" -Recurse -Force
          }

          if (Test-Path "$($PackPath.FullName)\Lib") {
              Copy-Item -Path "$($PackPath.FullName)\Lib\*" -Destination "$TargetKitsPath\Lib" -Recurse -Force
          } elseif (Test-Path "$($PackPath.FullName)\lib") {
              Copy-Item -Path "$($PackPath.FullName)\lib\*" -Destination "$TargetKitsPath\Lib" -Recurse -Force
          }
          
          # Mirror host compilation utilities into the location defined by WINDDK_TOOLS_DIR
          if (Test-Path "C:\Program Files (x86)\Windows Kits\10\Tools\10.0.26100.0\x64") {
              Copy-Item -Path "C:\Program Files (x86)\Windows Kits\10\Tools\10.0.26100.0\x64\*" -Destination "$TargetKitsPath\Tools\10.0.26100.0\x64" -Recurse -Force
          }
          
          # Force strict ASCII encoding on the mock wmic utility to prevent parsing crashes
          [System.IO.File]::WriteAllLines("C:\Windows\wmic.cmd", @("@echo off", "echo 20260526000000.000000+000"))
          
          # Save path configurations down into global runner environment block
          echo "LOCAL_EWDK_ROOT=${EWDKFakeRoot}" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Rewrite make.cfg parameters completely right before compilation execution
      - name: Patch make.cfg Configuration Tree
        shell: cmd
        working-directory: libusb/ddk_make
        run: |
          echo === Overriding Config File Variables ===
          :: Overwrite the default E:\ fallback parameters with our simulated workspace root
          echo WINDDK_BASE=%LOCAL_EWDK_ROOT%>> make.cfg
          echo WINDDK_DIR=%LOCAL_EWDK_ROOT%>> make.cfg
          
          echo === Updated Configuration File Head ===
          type make.cfg

      # Run your compilation sequence inside the established directory tree
      - name: Run Native Compilation via make.cmd
        shell: cmd
        working-directory: libusb/ddk_make
        run: |
          echo === Refreshing Version Header File ===
          call make.cmd MAKEVER
          
          echo === Compiling All Architectures via Rewritten EWDK Tree ===
          call make.cmd all

      # Harvest your output distribution artifacts
      - name: Collect and Upload Output Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libusb-win32-wdk-latest-binaries
          path: |
            **/bin/**/*.dll
            **/bin/**/*.lib
            **/bin/**/*.sys
            **/bin/**/*.inf
            **/bin/**/*.exe
          if-no-files-found: error

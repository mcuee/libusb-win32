name: CI - Build libusb-win32 via Pre-Installed WDK

on: [push, pull_request]

jobs:
  build-via-native-wdk:
    name: Build via Pre-Installed WDK 26100
    runs-on: windows-latest # Contains the 26100 tools natively

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Run compilation using the pre-existing tools on the runner disk
      - name: Run Native Compilation via make.cmd
        shell: cmd
        working-directory: ddk_make  # Adjust to 'libusb/ddk_make' if nested
        env:
          WINDDK_DIR: C:\Program Files (x86)\Windows Kits\10
          WDK_BASE: C:\Program Files (x86)\Windows Kits\10
        run: |
          echo === Verifying Environment Tree ===
          if exist "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0" (
              echo Found WDK 26100 headers successfully!
          ) else (
              echo Warning: Target version directory not found, checking fallback versions.
          )

          echo === Refreshing Version Header File ===
          call make.cmd MAKEVER
          
          echo === Compiling All Architectures via Native WDK ===
          call make.cmd all "WINDDK=C:\Program Files (x86)\Windows Kits\10\"

      - name: Collect Output Binaries
        uses: actions/upload-artifact@v7
        with:
          name: libusb-win32-native-wdk-artifacts
          path: |
            **/bin/**/*.dll
            **/bin/**/*.lib
            **/bin/**/*.sys
            **/bin/**/*.inf
          if-no-files-found: error

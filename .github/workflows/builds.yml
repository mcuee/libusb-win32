name: CI - Build libusb-win32 via EWDK 26100

on: [push, pull_request]

jobs:
  build-via-ewdk:
    name: Build via Mounted EWDK 26100
    runs-on: windows-latest # Perfectly leverages the modern VS2022 runner host base

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Installs the precise lightweight matching framework headlessly via package manager
      - name: Install WDK 10 via Chocolatey
        shell: powershell
        run: |
          choco install windows-sdk-10-version-22h2-all -y --no-progress
          choco install windowsdriverkit11 -y --no-progress

      # Point your build configurations to the freshly prepared global system paths
      - name: Run Native Compilation via make.cmd
        shell: cmd
        env:
          WINDDK_DIR: C:\Program Files (x86)\Windows Kits\10
          WDK_BASE: C:\Program Files (x86)\Windows Kits\10
        run: |
          cd ddk_make
          call make.cmd MAKEVER
          call make.cmd all "WINDDK=C:\Program Files (x86)\Windows Kits\10\"

      - name: Collect Output Binaries
        uses: actions/upload-artifact@v7
        with:
          name: libusb-win32-ewdk-26100-artifacts
          path: |
            **/bin/**/*.dll
            **/bin/**/*.lib
            **/bin/**/*.sys
            **/bin/**/*.inf
          if-no-files-found: error

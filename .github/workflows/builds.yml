name: CI - Build libusb-win32 via MSBuild and NuGet WDK

on: [push, pull_request]

jobs:
  build-via-msbuild:
    name: Build (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # High-level architecture targets
        platform: ["Win32", "x64", "ARM64"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup MSBuild Configuration
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet Environment
        uses: NuGet/setup-nuget@v3

      # Pull down the core compilation dependencies directly into the workspace
      - name: Restore WDK Packages
        shell: powershell
        working-directory: libusb
        run: |
          nuget install Microsoft.Windows.WDK.x64 -Version "10.0.26100.2454" -OutputDirectory packages

      # Automatically hooks into the MSBuild compilation tree to resolve ntifs.h / ntddk.h
      - name: Configure WDK Include Intercepts
        shell: powershell
        run: |
          $PropsContent = @"
          <Project>
            <PropertyGroup>
              <TargetVersion>Windows10</TargetVersion>
              <TargetPlatformVersion>10.0.26100.0</TargetPlatformVersion>
              <IncludeWdkHeaders>true</IncludeWdkHeaders>
            </PropertyGroup>
            <ItemDefinitionGroup>
              <ClCompile>
                <AdditionalIncludeDirectories>`$(SolutionDir)packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\build\native\include;`$(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
                <PreprocessorDefinitions>_WIN32_WINNT=0x0A00;NTDDI_VERSION=0x0A00000C;`$(PreprocessorDefinitions)</PreprocessorDefinitions>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          "@
          $PropsContent | Out-File -FilePath "libusb\Directory.Build.props" -Encoding utf8
          Write-Output "Successfully generated structural Directory.Build.props file for libusb-win32."

      # Compile step for 32-bit: Maps platform to 'x86' and targets user-space components only
      - name: Build 32-bit User Space Only
        if: matrix.platform == 'Win32'
        shell: cmd
        working-directory: libusb/projects/vs2019
        run: |
          echo === Compiling 32-bit User Space Libraries Only ===
          :: We pass x86 to satisfy the solution mapping, and target specific user projects if needed,
          :: or let it build libraries while skipping the driver project build settings.
          msbuild libusb-win32.sln /p:Configuration=Release /p:Platform=x86 /t:libusb0_dll;libusb0_lib /m

      # Compile step for 64-bit & ARM64: Compiles the full solution including drivers
      - name: Build Full 64-bit/ARM64 Solution
        if: matrix.platform != 'Win32'
        shell: cmd
        working-directory: libusb/projects/vs2019
        run: |
          echo === Compiling Full Solution [Platform=${{ matrix.platform }}] ===
          msbuild libusb-win32.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:DriverTargetPlatform="Desktop" /p:ApiValidatorAnalyze=false /p:InfVerif=false /m

      # Harvest all output binaries safely matching your distribution structure
      - name: Collect and Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libusb-win32-windows-2022-${{ matrix.platform }}-Output
          path: |
            libusb/**/*.dll
            libusb/**/*.lib
            libusb/**/*.sys
            libusb/**/*.inf
            libusb/**/*.exe
          if-no-files-found: error

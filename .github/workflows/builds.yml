name: CI - Build libusb-win32 via MSBuild and NuGet WDK

on: [push, pull_request]

jobs:
  build-via-msbuild:
    name: MSBuild Matrix Compilation
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup MSBuild pathing context natively on the runner host
      - name: Setup MSBuild Toolchain
        uses: microsoft/setup-msbuild@v2

      # Download and unpack the real WDK headers/libraries natively into the workspace
      - name: Fetch and Unpack WDK Development Components
        shell: powershell
        run: |
          Write-Host "Downloading matching 26100 WDK package via NuGet..."
          # Pull down the formal compilation headers and libraries package
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.2454 -OutputDirectory "${{ github.workspace }}\wdk_extracted"
          
          # Pin the exact unpacked package root folder path
          $PackPath = Get-ChildItem -Path "${{ github.workspace }}\wdk_extracted\Microsoft.Windows.WDK.x64.*" | Select-Object -First 1
          $WdkPropsDir = "$($PackPath.FullName)\build\native"
          
          # Inject paths safely down into the runner's continuous environment state
          echo "WDK_PROPS_DIR=$WdkPropsDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "WDK_INCLUDE_DIR=$($PackPath.FullName)\Include\10.0.26100.0" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "WDK_LIB_DIR=$($PackPath.FullName)\Lib\10.0.26100.0" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Compile the solution targeting your matrix architectures directly via MSBuild
      - name: Execute MSBuild Compiler Matrix
        shell: cmd
        working-directory: libusb/projects/vs2019
        run: |
          echo === Compiling Win32 Architecture ===
          msbuild libusb-win32.sln -m -t:Rebuild -p:Configuration=Release -p:Platform=Win32 -p:AdditionalIncludeDirectories="%WDK_INCLUDE_DIR%\km;%WDK_INCLUDE_DIR%\shared" -p:WDKContentRoot="%WDK_INCLUDE_DIR%"
          
          echo === Compiling x64 Architecture ===
          msbuild libusb-win32.sln -m -t:Rebuild -p:Configuration=Release -p:Platform=x64 -p:AdditionalIncludeDirectories="%WDK_INCLUDE_DIR%\km;%WDK_INCLUDE_DIR%\shared" -p:WDKContentRoot="%WDK_INCLUDE_DIR%"
          
          echo === Compiling ARM64 Architecture ===
          msbuild libusb-win32.sln -m -t:Rebuild -p:Configuration=Release -p:Platform=ARM64 -p:AdditionalIncludeDirectories="%WDK_INCLUDE_DIR%\km;%WDK_INCLUDE_DIR%\shared" -p:WDKContentRoot="%WDK_INCLUDE_DIR%"

      # Harvest all compiled binaries generated by the MSBuild target output rules
      - name: Collect and Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libusb-win32-msbuild-binaries
          path: |
            **/Release/**/*.dll
            **/Release/**/*.lib
            **/Release/**/*.sys
            **/Release/**/*.inf
            **/Release/**/*.exe
          if-no-files-found: error
